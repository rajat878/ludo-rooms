<script>
const COLORS=['red','green','yellow','blue'];
const HEX={red:'#e5483f',green:'#2fa84f',yellow:'#f2b705',blue:'#2f7de1'};
const LIGHT={red:'#ff9a90',green:'#8be8a2',yellow:'#ffe58a',blue:'#9ccbff'};
const START={red:0,green:13,yellow:26,blue:39};
const ORG={red:[0,0],green:[9,0],yellow:[9,9],blue:[0,9]};
const HOME={red:k=>[1+k,7],green:k=>[7,1+k],yellow:k=>[13-k,7],blue:k=>[7,13-k]};
const FIN={red:[-.75,0],green:[0,-.75],yellow:[.75,0],blue:[0,.75]};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const PATH=[];
(function(){const a=(c,r)=>PATH.push([c,r]);
for(let c=1;c<=5;c++)a(c,6);for(let r=5;r>=0;r--)a(6,r);a(7,0);a(8,0);
for(let r=1;r<=5;r++)a(8,r);for(let c=9;c<=14;c++)a(c,6);a(14,7);a(14,8);
for(let c=13;c>=9;c--)a(c,8);for(let r=9;r<=14;r++)a(8,r);a(7,14);a(6,14);
for(let r=13;r>=9;r--)a(6,r);for(let c=5;c>=0;c--)a(c,8);a(0,7);a(0,6);})();

const BRAND='We 4 <span style="color:#e5483f">L</span><span style="color:#2fa84f">U</span><span style="color:#f2b705">D</span><span style="color:#2f7de1">O</span>';
const app=document.getElementById('app');
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const nm=(S,c)=>(S.players[c]&&S.players[c].name)||c;
const abs=(c,p)=>(START[c]+p)%52;
const toast=t=>{let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2200)};
const err=m=>{const e=document.getElementById('msg');if(e)e.textContent=m};

/* ---------- sound ---------- */
let AC=null,mute=ls.get('ludo.mute')==='1';
function unlock(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,w){if(mute||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(w||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={roll(){for(let k=0;k<6;k++)tone(200+Math.random()*300,.05,'square',.05,k*.11)},hop(){tone(540,.07,'triangle',.14)},
cap(){tone(330,.12,'sawtooth',.09);tone(160,.25,'sawtooth',.09,.1)},home(){tone(660,.1,'sine',.15);tone(880,.2,'sine',.15,.1)},
nomove(){tone(240,.2,'sawtooth',.07);tone(180,.25,'sawtooth',.07,.15)},
turn(){tone(780,.08,'sine',.1);tone(1040,.1,'sine',.1,.09)},win(){[523,659,784,1047].forEach((f,k)=>tone(f,.28,'triangle',.15,k*.14))}};
document.addEventListener('pointerdown',unlock);

/* ---------- connection ---------- */
const socket=io();
let lastHold=null,state=null,online=false,recv=0,lastCode='',lastStatus='',lastTurn='',lastRoll=0,celebrated=false;
let shown=null,tgt=null,jobs=[],cur=null,diceUntil=0,rollStart=0,raf=0,shuf=0,shufC=null,resD=null,shufStart=0;
const hist={red:1,green:1,yellow:1,blue:1};
const rolling=()=>!!shuf||performance.now()<diceUntil;
const animating=()=>rolling()||!!cur||jobs.length>0;

socket.on('connect',()=>{online=true;const r=ls.get('ludo.room');if(r)join(r,ls.get('ludo.name')||'Player',true);else if(!state)home()});
socket.on('kicked',m=>{ls.del('ludo.room');state=null;home(m)});
socket.on('disconnect',()=>{online=false;toast('Connection lost, reconnecting…')});
socket.on('state',S=>{
  const first=!state||S.code!==lastCode;
  state=S;recv=Date.now();
  const snap=first||(S.status==='playing'&&lastStatus!=='playing')||S.status==='lobby';
  if(snap){shown=clone(S.tokens);tgt=clone(S.tokens);jobs=[];cur=null;lastRoll=S.rollSeq;celebrated=false}
  else{
    if(S.rollSeq>lastRoll){lastRoll=S.rollSeq;const n=performance.now();if(n-rollStart>1500){rollStart=n;sfx.roll()}diceUntil=rollStart+750;startShuffle(S.last.c,S.last.d)}
    S.order.forEach(c=>S.tokens[c].forEach((p,i)=>{if(tgt[c][i]!==p){jobs.push({c,i,from:tgt[c][i],to:p});tgt[c][i]=p}}));
    jobs.sort((a,b)=>(b.to>=0)-(a.to>=0));
  }
  if(S.hold&&S.hold!==lastHold&&!snap)setTimeout(sfx.nomove,800);lastHold=S.hold;
  if(S.last)hist[S.last.c]=S.last.d;
  if(S.status==='playing'&&S.turn===S.me&&lastTurn!==S.turn&&!snap)setTimeout(sfx.turn,700);
  lastTurn=S.turn;lastStatus=S.status;lastCode=S.code;
  render();kick();maybeCelebrate();
});

/* ---------- profile photo ---------- */
let myAvatar=ls.get('ludo.avatar')||'',avs={};
const okAv=a=>typeof a==='string'&&a.length<=16000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(a);
function avFace(c,sz){
  const a=avs[c],st=`width:${sz}px;height:${sz}px;--c:${HEX[c]}`;
  if(okAv(a))return `<img class="fa" alt="" src="${a}" style="${st}">`;
  const n=((state&&state.players[c]&&state.players[c].name[0])||'?').toUpperCase();
  return `<div class="av" style="${st};background:${HEX[c]};font-size:${Math.round(sz*.45)}px">${esc(n)}</div>`;
}
function pickPhoto(file){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const S=96,cv=document.createElement('canvas');cv.width=cv.height=S;const x=cv.getContext('2d');
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    x.drawImage(img,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(url);
    let q=.8,d=cv.toDataURL('image/jpeg',q);while(d.length>15000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}
    if(!okAv(d))return toast('Could not use that photo, try another');
    myAvatar=d;ls.set('ludo.avatar',d);paintProfile();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Could not read that photo')};
  img.src=url;
}
function paintProfile(){
  const ok=okAv(myAvatar),a=document.getElementById('pfa');if(!a)return;
  a.className='pfa'+(ok?' set':'');a.innerHTML=ok?`<img alt="" src="${myAvatar}">`:'📷';
  const t=document.getElementById('pfh');t.className='pfh '+(ok?'ok':'need');t.textContent=ok?'Looking good! 😎':'Add your photo to play';
  ['mk','jn'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=!ok});
}
socket.on('avatars',a=>{avs=a||{};if(state)render()});

function join(code,name,silent){
  socket.emit('join',{code,name,avatar:myAvatar,token:ls.get('ludo.tok.'+code)||undefined},r=>{
    if(r.error){if(silent){ls.del('ludo.room');home()}else err(r.error);return}
    ls.set('ludo.room',r.code);if(r.token)ls.set('ludo.tok.'+r.code,r.token);wake();
  });
}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}

/* ---------- actions ---------- */
function canRollNow(){const S=state;return !!S&&S.status==='playing'&&S.turn===S.me&&S.dice==null&&!S.hold&&!animating()}
function rollTap(){
  if(!canRollNow())return;
  rollStart=performance.now();diceUntil=rollStart+750;sfx.roll();startShuffle(state.me,null);kick();socket.emit('roll');

function tap(c,i){if(state&&c===state.me&&!animating()&&state.dice!=null&&state.movable.includes(i))socket.emit('move',i)}

function invite(){
  const t=`Join my We 4 Ludo game! Room code: ${state.code}`,u=location.origin;
  if(navigator.share){navigator.share({title:'We 4 Ludo',text:t,url:u}).catch(()=>{})}

/* ---------- dice ---------- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const pips=v=>Array.from({length:9},(_,k)=>`<i class="${v&&PIPS[v].includes(k)?'p':''}"></i>`).join('');
function setFace(c,v){const d=document.getElementById('dice-'+c);if(d)d.innerHTML=pips(v)}
function startShuffle(c,d){
  clearInterval(shuf);shufC=c;resD=d;shufStart=performance.now();
  const el=document.getElementById('dice-'+c);if(el){el.classList.add('roll');el.classList.remove('my')}
  shuf=setInterval(()=>{
    const n=performance.now();
    if(n>=diceUntil&&(resD!=null||n-shufStart>3000)){
      clearInterval(shuf);shuf=0;const f=resD!=null?resD:hist[shufC];hist[shufC]=f;shufC=null;render();maybeCelebrate();return}
    setFace(shufC,1+Math.floor(Math.random()*6));
  },75);
}
/* ---------- token animation ---------- */
function kick(){if(!raf)raf=requestAnimationFrame(frame)}
function buildSteps(j,c,i){
  if(j.to<0)return[{p:-1,dur:450,sfx:sfx.cap,kind:'back'}];
  if(j.from<0)return[{p:0,dur:280,sfx:sfx.hop,kind:'out'}];
  const s=[];for(let p=j.from+1;p<=j.to;p++)s.push({p,dur:180,sfx:p===56?sfx.home:sfx.hop,kind:'hop'});return s;
}
function frame(){
  raf=0;const now=performance.now();
  if(!cur&&jobs.length&&now>=diceUntil){cur=jobs.shift();cur.steps=buildSteps(cur);cur.k=0;cur.t0=now;cur.u=0}
  if(cur){
    const st=cur.steps[cur.k];cur.u=Math.min(1,(now-cur.t0)/st.dur);
    if(cur.u>=1){shown[cur.c][cur.i]=st.p;st.sfx();cur.k++;cur.t0=now;cur.u=0;
      if(cur.k>=cur.steps.length){cur=null;if(!jobs.length){render();maybeCelebrate()}}}
  }
  drawTokens();
  if(cur||jobs.length||rolling())raf=requestAnimationFrame(frame);
}
function pos(c,p,i){
  if(p<0){const[ox,oy]=ORG[c];return[ox+(i%2?4:2),oy+(i<2?2:4)]}
  if(p<=50){const[x,y]=PATH[abs(c,p)];return[x+.5,y+.5]}
  if(p<56){const[x,y]=HOME[c](p-51);return[x+.5,y+.5]}
  const o=FIN[c],j=(i-1.5)*.12;return[7.5+o[0]+j,7.5+o[1]+j];
}
const DARK={red:'#8f1f19',green:'#17692f',yellow:'#a67c00',blue:'#174f9c'};
const TEAR='M0,-.02 C-.07,-.17 -.3,-.28 -.3,-.5 A.3,.3 0 1 1 .3,-.5 C.3,-.28 .07,-.17 0,-.02Z';
function pinSVG(t){
  const c=t.c,s=t.sc,x=t.x+t.dx,by=t.y+.22,k=1-t.lift*.45;
  const ring=t.can?'<ellipse class="mv" cx="0" cy="0" rx=".47" ry=".24" fill="none" stroke="#000" stroke-opacity=".55" stroke-width=".14"/><ellipse class="mv" cx="0" cy="0" rx=".47" ry=".24" fill="none" stroke="#fff" stroke-width=".06"/>':'';
  return `<g class="tk" data-c="${c}" data-i="${t.i}"><ellipse cx="${x}" cy="${by+.05}" rx="${.34*s*k}" ry="${.13*s*k}" fill="#000" opacity=".3"/>
  <g transform="translate(${x} ${by-t.lift}) scale(${s})">${ring}<g class="${t.can?'bobpin':''}">
  <ellipse cx="0" cy=".07" rx=".3" ry=".13" fill="${DARK[c]}"/><ellipse cx="0" cy="0" rx=".3" ry=".13" fill="${HEX[c]}" stroke="${DARK[c]}" stroke-width=".04"/>
  <path d="${TEAR}" fill="url(#pinw)" stroke="#70707c" stroke-width=".035"/>
  <circle cx="0" cy="-.5" r=".2" fill="url(#g-${c})" stroke="${DARK[c]}" stroke-width=".03"/>
  <ellipse cx="-.08" cy="-.58" rx=".06" ry=".035" fill="#fff" opacity=".85" transform="rotate(-25 -.08 -.58)"/>
  <ellipse cx="-.2" cy="-.4" rx=".035" ry=".1" fill="#fff" opacity=".7"/></g>
  <circle cx="0" cy="-.35" r=".55" fill="transparent"/></g></g>`;
}
function drawTokens(){
  const g=document.getElementById('tl');if(!g||!state||!shown)return;
  const S=state,me=S.me,mv=(!animating()&&S.status==='playing'&&S.turn===me&&S.dice!=null)?S.movable:[];
  let ghost='';
  mv.forEach(i=>{const p=shown[me][i],d=p<0?0:p+S.dice,[x,y]=pos(me,d,i);
    ghost+=`<ellipse class="mv" cx="${x}" cy="${y+.22}" rx=".36" ry=".17" fill="${HEX[me]}" fill-opacity=".5" stroke="#fff" stroke-width=".08" stroke-dasharray=".14 .1"/>`});
  const items=[];
  S.order.forEach(c=>shown[c].forEach((p,i)=>{
    let[x,y]=pos(c,p,i),lift=0;const anim=!!(cur&&cur.c===c&&cur.i===i);
    if(anim){const st=cur.steps[cur.k],b=pos(c,st.p,i),u=cur.u,e=u*u*(3-2*u);x+=(b[0]-x)*e;y+=(b[1]-y)*e;lift=st.kind==='back'?0:Math.sin(u*Math.PI)*.5}
    items.push({c,i,p,x,y,lift,anim,dx:0,sc:p===56?.6:1,can:!anim&&c===me&&mv.includes(i),key:(p<0||anim)?null:Math.round(x*10)+','+Math.round(y*10)});
  }));
  const groups={};items.forEach(t=>{if(t.key)(groups[t.key]=groups[t.key]||[]).push(t)});
  Object.values(groups).forEach(a=>{if(a.length>1)a.forEach((t,n)=>{t.dx=(n-(a.length-1)/2)*.3;t.sc*=.8})});
  items.sort((a,b)=>(a.anim-b.anim)||(a.y-b.y));
  g.innerHTML=ghost+items.map(pinSVG).join('');
}

/* ---------- board + screen ---------- */
const DIRS={red:[1,0],green:[0,1],yellow:[-1,0],blue:[0,-1]},ENTRY={red:[0,7],green:[7,0],yellow:[14,7],blue:[7,14]};
function starPts(cx,cy,R,r){const a=[];for(let k=0;k<10;k++){const t=-Math.PI/2+k*Math.PI/5,q=k%2?r:R;a.push((cx+q*Math.cos(t)).toFixed(3)+','+(cy+q*Math.sin(t)).toFixed(3))}return a.join(' ')}
function boardSVG(S){
  let s='<svg viewBox="0 0 15 15" class="board" id="bd" style="--tc:'+(HEX[S.turn]||'transparent')+'"><defs><linearGradient id="pinw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cdd0d8"/></linearGradient>'+
   COLORS.map(c=>`<radialGradient id="g-${c}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${LIGHT[c]}"/><stop offset="1" stop-color="${HEX[c]}"/></radialGradient>`).join('')+'</defs>';
  COLORS.forEach(c=>{const[ox,oy]=ORG[c],on=S.status==='playing'&&S.turn===c,p=S.players[c];
    s+=`<rect x="${ox}" y="${oy}" width="6" height="6" fill="${HEX[c]}"/>`;
    if(on)s+=`<rect class="mv" x="${ox+.08}" y="${oy+.08}" width="5.84" height="5.84" fill="none" stroke="#fff" stroke-width=".14"/>`;
    s+=`<rect x="${ox+1}" y="${oy+1}" width="4" height="4" rx=".45" fill="#fff" stroke="rgba(0,0,0,.18)" stroke-width=".06"/>`;
    [[2,2],[4,2],[2,4],[4,4]].forEach(q=>s+=`<circle cx="${ox+q[0]}" cy="${oy+q[1]+.18}" r=".46" fill="${HEX[c]}" stroke="${DARK[c]}" stroke-width=".06"/>`);
    if(p){const ty=oy===0?.7:oy+5.7,nmx=esc(p.name.slice(0,12));
      s+=`<text x="${ox+3}" y="${ty}" font-size=".5" font-weight="800" text-anchor="middle" fill="none" stroke="rgba(0,0,0,.55)" stroke-width=".12" stroke-linejoin="round">${nmx}</text><text x="${ox+3}" y="${ty}" font-size=".5" font-weight="800" text-anchor="middle" fill="#fff">${nmx}</text>`}});
  PATH.forEach(([x,y],i)=>{const st=COLORS.find(c=>START[c]===i);
    s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${st?HEX[st]:'#fdfbf4'}" stroke="#d6d0bc" stroke-width=".05"/>`;
    if(!st&&SAFE.has(i))s+=`<polygon points="${starPts(x+.5,y+.52,.36,.15)}" fill="#fdfbf4" stroke="#9a937c" stroke-width=".05"/>`});
  COLORS.forEach(c=>{for(let k=0;k<5;k++){const[x,y]=HOME[c](k);s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${HEX[c]}" stroke="#fff" stroke-opacity=".7" stroke-width=".05"/>`}
    const[ex,ey]=ENTRY[c],[dx,dy]=DIRS[c],cx=ex+.5,cy=ey+.5;
    s+=`<polygon points="${cx+dx*.28},${cy+dy*.28} ${cx-dx*.2-dy*.26},${cy-dy*.2+dx*.26} ${cx-dx*.2+dy*.26},${cy-dy*.2-dx*.26}" fill="${HEX[c]}"/>`});
  s+=`<polygon points="6,6 6,9 7.5,7.5" fill="${HEX.red}"/><polygon points="6,6 9,6 7.5,7.5" fill="${HEX.green}"/><polygon points="9,6 9,9 7.5,7.5" fill="${HEX.yellow}"/><polygon points="6,9 9,9 7.5,7.5" fill="${HEX.blue}"/><path d="M6,6 L9,9 M9,6 L6,9" stroke="#fff" stroke-opacity=".6" stroke-width=".05"/><g id="tl"></g></svg>`;
  return s;
}
const RULESPEC=[
 ['maxConsecutiveSixes','Sixes in a row',[[3,'3rd loses turn'],[2,'2nd loses turn'],[0,'No limit']]],
 ['extraTurnOnCapture','Capture gives extra turn',[[true,'Yes'],[false,'No']]],
 ['extraTurnOnHome','Reaching home gives extra turn',[[true,'Yes'],[false,'No']]],
 ['safeSquares','Safe squares (★)',[[true,'On'],[false,'Off']]],

function topbar(S){
  return `<div class="bar">${S.status==='lobby'?`<div class="rt"><small>ROOM</small><b>${esc(S.code)}</b></div>`:`<div class="bm"><div class="bn">${BRAND}</div><div class="bb">by Rajat Walia</div></div>`}<div class="btns">

function playerCard(S,c){
  const p=S.players[c];if(!p)return '<div></div>';
  const on=S.status==='playing'&&S.turn===c,me=S.me,rl=shufC===c,canRoll=on&&c===me&&S.dice==null&&!S.hold&&!animating(),held=on&&!!S.hold;
  const face=rl?1+Math.floor(Math.random()*6):hist[c];
  const sub=on?(held?'':'<span id="tm"></span>'):(p.auto?'autopilot':c===me?'You':(p.on?'':'offline'));

function render(){
  const S=state;if(!S)return;
  let h=topbar(S);
  if(S.status==='lobby'){
    const n=COLORS.filter(c=>S.players[c]).length;
    fx(true);
    h+=`<div class="lob">${hero(true)}<div class="sub" style="margin:0">Share this code with friends</div><div class="bigcode">${esc(S.code)}</div><div class="seats">`+
    COLORS.map(c=>{const p=S.players[c];return p?`<div class="seat" style="--c:${HEX[c]}">${avFace(c,40)}<div class="pn">${esc(p.name)}${c===S.me?' (you)':''}</div></div>`:`<div class="seat empty"><div class="av" style="background:transparent;border:2px dashed ${HEX[c]}"></div><div class="pn">Waiting…</div></div>`}).join('')+
    `</div>${S.isHost?rulesPanel(S):''}<button id="inv2">📨 Invite friends</button>${S.isHost?`<button id="st" class="pri" ${n<2?'disabled':''}>${n<2?'Need at least 2 players':'Start game'}</button>`:'<p class="sub">Waiting for the host to start…</p>'}</div>`;
  }else{
    fx(false);const mine=S.status==='playing'&&S.turn===S.me;
    const line=S.status==='done'?`🏆 ${esc(nm(S,S.winner))} wins!`:S.hold==='none'?`😕 ${esc(nm(S,S.turn))} rolled ${S.last?S.last.d:''}: no move possible`:S.hold==='sixes'?'🚫 Three 6s in a row: turn lost':mine?(S.dice==null?'Your turn: roll the dice':'Tap a glowing token'):`${esc(nm(S,S.turn))}’s turn`;
    h+=`<div class="row">${playerCard(S,'red')}${playerCard(S,'green')}</div><div class="bwrap">${boardSVG(S)}</div><div class="row">${playerCard(S,'blue')}${playerCard(S,'yellow')}</div>
    <div class="foot"><div class="status" style="--c:${HEX[S.status==='done'?S.winner:S.turn]};--ca:${HEX[S.status==='done'?S.winner:S.turn]}33">${line}</div><div class="log">${esc(S.log||'')}</div></div>`;
    if(S.status==='done'&&!animating())h+=`<div class="ov"><div class="ovc"><div style="display:flex;justify-content:center">${avFace(S.winner,84)}</div><div style="font-size:40px">🏆</div><h2>${esc(nm(S,S.winner))} wins!</h2><button id="rm" class="pri" ${S.rematch.includes(S.me)?'disabled':''}>${S.rematch.includes(S.me)?'Waiting for others…':'Rematch'} (${S.rematch.length}/${COLORS.filter(c=>S.players[c]&&S.players[c].on).length})</button><button id="lv2">Leave room</button></div></div>`;
  }
  app.innerHTML=h;
  const $=id=>document.getElementById(id);
  $('iv').onclick=invite;$('lv').onclick=leave;$('cbtn').onclick=()=>toggleChat(!chatOpen);
  $('mt').onclick=()=>{mute=!mute;ls.set('ludo.mute',mute?'1':'0');unlock();$('mt').textContent=mute?'🔇':'🔊'};
  ['st'].forEach(k=>{if($(k))$(k).onclick=start});if($('inv2'))$('inv2').onclick=invite;app.querySelectorAll('select[data-k]').forEach(el=>el.onchange=()=>socket.emit('rules',{[el.dataset.k]:JSON.parse(el.value)}));if($('lv2'))$('lv2').onclick=leave;if($('rm'))$('rm').onclick=()=>socket.emit('rematch');
  const dm=$('dice-'+S.me);if(dm&&dm.classList.contains('my')){dm.onclick=rollTap;$('pc-'+S.me).onclick=rollTap}
  if($('bd'))$('bd').onclick=e=>{const g=e.target.closest&&e.target.closest('.tk');if(g)tap(g.dataset.c,+g.dataset.i)};
  drawTokens();updateTimer();
}
function updateTimer(){
  const e=document.getElementById('tm');if(!e||!state||state.status!=='playing')return;
  const left=Math.max(0,state.left-(Date.now()-recv)/1000);e.textContent=Math.ceil(left)+'s';
  const b=document.getElementById('tb');if(b)b.style.width=Math.min(100,left/Math.max(1,state.tot)*100)+'%';
}
setInterval(updateTimer,250);

/* ---------- chat ---------- */
let chat=[],chatOpen=false,unread=0;
const REACTS=['😂','👏','😡','🔥','❤️','😭'],PHRASES=['तू जीत के दिखा 😎🔥','इतनी आसानी से कैसे 😏','मज़ा आ गया 🤩','ओह हो! 😅','वाह! 😲','अभी तो शुरुआत है 😈'];
document.getElementById('chat').innerHTML=`<div class="sh"><b>Chat</b><button class="ib" id="cx">✕</button></div><div class="cl" id="cl"></div>
<div class="qr">${REACTS.map(e=>`<button class="ib q" data-e="${e}">${e}</button>`).join('')}</div>
<div class="qp">${PHRASES.map(p=>`<button class="chipb" data-p="${p}">${p}</button>`).join('')}</div>
<div class="ci"><input id="cin" maxlength="140" placeholder="Type a message…" autocomplete="off"><button id="csend" class="pri">Send</button></div>`;
const chatEl=document.getElementById('chat');
function setBadge(){const b=document.getElementById('cb');if(b){b.textContent=unread;b.hidden=!unread}}
function toggleChat(o){chatOpen=o;chatEl.classList.toggle('open',o);if(o){unread=0;setBadge();renderChat()}else{const i=document.getElementById('cin');if(i)i.blur()}}
function renderChat(){const l=document.getElementById('cl');
  l.innerHTML=chat.map(m=>`<div class="m ${state&&m.c===state.me?'me':''}"><b style="color:${HEX[m.c]||'#fff'}">${esc(m.name)}</b><span>${esc(m.text)}</span></div>`).join('')||'<div class="empty">No messages yet. Say hi 👋</div>';
  l.scrollTop=l.scrollHeight}
function sendChat(t){t=(t||'').trim();if(t)socket.emit('chat',t)}
document.getElementById('cx').onclick=()=>toggleChat(false);
document.getElementById('csend').onclick=()=>{const i=document.getElementById('cin');sendChat(i.value);i.value=''};
document.getElementById('cin').onkeydown=e=>{if(e.key==='Enter'){sendChat(e.target.value);e.target.value=''}};
chatEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)socket.emit('react',b.dataset.e);if(b.dataset.p)sendChat(b.dataset.p)});
function anchor(c){const el=document.getElementById('pc-'+c);return el?el.getBoundingClientRect():null}
function bubble(c,text){const r=anchor(c);if(!r||chatOpen)return;const d=document.createElement('div');d.className='bub';d.style.setProperty('--c',HEX[c]);d.textContent=text.slice(0,48);
  document.body.appendChild(d);const w=d.offsetWidth;d.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';
  d.style[r.top>innerHeight/2?'bottom':'top']=(r.top>innerHeight/2?innerHeight-r.top+6:r.bottom+6)+'px';setTimeout(()=>d.remove(),3400)}
function floatEmoji(c,e){const r=anchor(c);if(!r)return;const d=document.createElement('div');d.className='fl';d.textContent=e;d.style.left=(r.left+r.width/2-20)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
socket.on('chatlog',a=>{chat=a;if(chatOpen)renderChat()});
socket.on('chat',m=>{chat.push(m);if(chat.length>50)chat.shift();if(chatOpen)renderChat();else{unread++;setBadge()}bubble(m.c,m.text)});
socket.on('react',r=>{floatEmoji(r.c,r.e);sfx.hop()});

/* ---------- win ---------- */
function maybeCelebrate(){
  if(!state||state.status!=='done'||celebrated||animating())return;celebrated=true;sfx.win();
  const w=document.createElement('div');w.className='conf';
  for(let k=0;k<70;k++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${HEX[COLORS[k%4]]};animation-delay:${Math.random()*1.2}s;animation-duration:${2+Math.random()*2}s`;w.appendChild(e)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),5500);
}
buildBg();home();
</script></body></html>
